<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoção</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="a"></div>
    <div class="navbar">
        <h1 class="titulo">FRTS Adoções</h1>
    </div>

    <div class="fundo_cadastro">
        <H1 class="titulo">Cadastro para adoção</H1>
        <h2>Preencha as informações no formulário</h4><br><br>

        <form id="form_adacao">
            <input type="text" id="nome" placeholder="Nome completo"><br><br>

            <input type="text" id="email" placeholder="Email"><br><br>

            <input type="text" id="telefone" placeholder="Telefone"><br><br>

            <input type="number" id="cpf" placeholder="cpf"><br><br>

            <input type="number" id="idade" placeholder="idade"><br><br>

            <input type="text" id="cidade" placeholder="cidade"><br><br>

            <label>Moradia:</label>
                <select id="moradia">
                    <option value="selecione"></option>
                    <option value="casa">casa</option>
                    <option value="apartamento">apartamento</option>
                </select><br><br>

            <label>Possui quintal:</label>
            <select  id="quintal">
                    <option value="selecione"></option>
                    <option value="sim">Sim</option>
                    <option value="nao">Não</option>
            </select><br><br>

            <label>Ja teve pet?:</label>
            <select id="pet">
                    <option value="selecione"></option>
                    <option value="sim">Sim</option>
                    <option value="nao">Não</option>
            </select><br><br>

            <input type="text" id="horas" placeholder="Horas sozinho por dia"><br><br>

            <input type="text" id="motivo" placeholder="Motivo da adoção"><br><br>

            <label>Tem condições financeiras:</label>
            <select id="condicao">
                    <option value="selecione"></option>
                    <option value="sim">Sim</option>
                    <option value="nao">Não</option>
            </select><br><br>

            <label>Quando decidiu adotar::</label>
            <select id="decisao">
                    <option value="selecione"></option>
                    <option value="hoje">hoje</option>
                    <option value="alguns _dias">Alguns dias</option>
                    <option value="mais_tempo">A um tempo atrás</option>
            </select><br><br>

             <label>Possui espaço externo para o pet:</label>
            <select id="espaco">
                    <option value="selecione"></option>
                    <option value="sim">Sim</option>
                    <option value="nao">Não</option>
            </select><br><br>

            <input type="checkbox" id="termo">
            <label for="termo">Aceito os termos</label><br>

            <button type="submit">Enviar</button>

        </form>
    </div> 

    <link rel="stylesheet" href="script.js">
</body>
</html>
